# Alembic del módulo retail. Aislado del resto del ERP a propósito: el ERP
# no usa migraciones versionadas (los .sql de SUPABASE_MIGRATION_* se corren a
# mano), y mezclarlos haría que `alembic upgrade head` tocara tablas que no son
# de este módulo.
[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
path_separator = os
prepend_sys_path = ../../../..
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
